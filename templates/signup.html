
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>
    <style>
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .signup-card { background: white; padding: 30px 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #007bff; margin-bottom: 25px; font-weight: bold; }
        .form-group { text-align: right; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; background: #fafafa; text-align: right; outline: none; }
        button { width: 100%; padding: 14px; background: #2196F3; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .footer-link { margin-top: 20px; font-size: 14px; color: #666; }
        .footer-link a { color: #007bff; text-decoration: none; font-weight: bold; }
        .error-msg { color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; display: block; }
    </style>
</head>
<body>
    <div class="signup-card">
        <h2>إنشاء حساب جديد</h2>
        
        {% if message %}
            <div class="error-msg">{{ message }}</div>
        {% endif %}
        
        <form action="/signup" method="POST">
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" name="fullname" placeholder="أدخل اسمك بالكامل" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني:</label>
                <input type="email" name="email" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="text" name="phone" placeholder="01xxxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>تاريخ الميلاد:</label>
                <input type="date" name="dob" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" name="password" placeholder="********" required>
            </div>
            <div class="form-group">
                <label>تأكيد كلمة المرور:</label>
                <input type="password" name="confirm_password" placeholder="********" required>
            </div>
            <button type="submit">تسجيل البيانات</button>
        </form>
        <div class="footer-link">لديك حساب بالفعل؟ <a href="/">تسجيل الدخول</a></div>
    </div>
</body>
</html>
